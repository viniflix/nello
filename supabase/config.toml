# Production configuration is managed separately; this file contains no credentials.
# Use scripts/backend/prepare.mjs on a REMOTE runner to reconstruct applied history.
project_id = "nello-reconstruction"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
# Flat legacy files are references and MUST NOT be replayed alongside applied history.
enabled = false
schema_paths = []

[db.seed]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = ["http://127.0.0.1:4173/**"]
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.email]
enable_signup = true
enable_confirmations = true
secure_password_change = false

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[functions.create-patient]
verify_jwt = true
[functions.delete-user-securely]
verify_jwt = true
[functions.generate-pdf]
verify_jwt = true
[functions.sentry-issues]
verify_jwt = true
[functions.sentry-test]
verify_jwt = true
[functions.sentry-proxy]
verify_jwt = true
[functions.openfoodfacts-proxy]
verify_jwt = true
[functions.confirm-document-asset]
verify_jwt = true
