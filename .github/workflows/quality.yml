name: Quality gate

on:
  push:
    branches: [main, 'codex/wave-*']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-install:
    name: Vercel installation regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Provider runtime observed in the failed and successful builds.
          node-version: '22.23.2'
      - name: Exercise actual installer against an injected registry setting
        run: node scripts/release/install.mjs
        env:
          # The public CLI registry override must win, just as it does on Vercel.
          npm_config_registry: http://127.0.0.1:9
      - name: Check installed npm and compile the clean dependency tree
        run: |
          test "$(npm --version)" = '11.5.2'
          npm run build
          npm run check:bundle
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/release/install.mjs
      - run: npm run verify:release
        env:
          # Unit tests instantiate the public client, but never contact a real project.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      - name: Preserve critical coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: critical-coverage-${{ github.sha }}
          path: coverage/coverage-summary.json
          if-no-files-found: error
