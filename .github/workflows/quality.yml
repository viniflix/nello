name: Quality gate

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  provider-install:
    name: Vercel installation regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          # Provider runtime observed in the failed and successful builds.
          node-version: '22.23.2'
      - name: Exercise actual installer against an injected registry setting
        run: node scripts/release/install.mjs
        env:
          # The public CLI registry override must win, just as it does on Vercel.
          npm_config_registry: http://127.0.0.1:9
      - name: Check installed npm and compile the clean dependency tree
        run: |
          test "$(npm --version)" = '11.21.0'
          npm run build
          npm run check:bundle
        env:
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/release/install.mjs
      - run: npm run verify:release
        env:
          # Unit tests instantiate the public client, but never contact a real project.
          VITE_SUPABASE_URL: https://ci-placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder-anon-key
      - name: Preserve critical coverage evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-coverage-${{ github.sha }}
          path: coverage/coverage-summary.json
          if-no-files-found: error
      - name: Preserve versioned dependency inventory and third-party notices
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: third-party-inventory-${{ github.sha }}
          path: |
            .qa-licenses/runtime.cyclonedx.json
            .qa-licenses/runtime-inventory.json
            .qa-licenses/THIRD_PARTY_NOTICES.txt
          include-hidden-files: true
          if-no-files-found: error
