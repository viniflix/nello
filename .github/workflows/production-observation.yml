name: Production observation
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: production-observation
  cancel-in-progress: false
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .nvmrc
      - name: Locate previous budget delivery state
        id: previous-budget
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { data } = await github.rest.actions.listArtifactsForRepo({ ...context.repo, name: 'production-budget-state', per_page: 20 });
            const prior = data.artifacts.find(a => !a.expired && a.workflow_run?.head_branch === 'main' && a.workflow_run.id !== context.runId);
            if (prior) core.setOutput('run-id', String(prior.workflow_run.id));
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.previous-budget.outputs.run-id != ''
        with:
          name: production-budget-state
          path: previous-budget
          run-id: ${{ steps.previous-budget.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Evaluate continuous Sentry uptime checks and deliver grouped budget alerts
        run: node scripts/availability/provider-burn-rate.mjs
        env:
          SENTRY_MONITOR_READ_TOKEN: ${{ secrets.SENTRY_MONITOR_READ_TOKEN }}
          SENTRY_DSN: ${{ secrets.PRODUCTION_MONITOR_SENTRY_DSN }}
      - name: Verify analytics ingestion and release metadata independently of user traffic
        run: node scripts/observability/pipeline-monitor.mjs
        env:
          POSTHOG_MONITOR_READ_TOKEN: ${{ secrets.POSTHOG_MONITOR_READ_TOKEN }}
          POSTHOG_MONITOR_CAPTURE_KEY: ${{ secrets.POSTHOG_MONITOR_CAPTURE_KEY }}
          SENTRY_DSN: ${{ secrets.PRODUCTION_MONITOR_SENTRY_DSN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-budget-state
          path: |
            production-budget.json
            production-analytics.json
          retention-days: 7
          if-no-files-found: error
      - name: Check live health, assets, headers, status and real 404 contracts
        run: node scripts/availability/production-check.mjs
        env:
          SENTRY_DSN: ${{ secrets.PRODUCTION_MONITOR_SENTRY_DSN }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-observation-${{ github.run_id }}
          path: production-check.json
          retention-days: 7
