name: Backend reconstruction
on:
  push:
    branches: [main, 'codex/wave-01-*']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.5.2
      - run: npm ci
      - name: Verify and prepare authoritative migration history
        run: node scripts/backend/prepare.mjs
      - name: Rebuild database on the remote runner
        id: rebuild
        run: |
          set -o pipefail
          npx --no-install supabase start --workdir .backend-ci --exclude studio,analytics,vector,imgproxy 2>&1 | tee backend-reconstruction.log
      - name: Restore isolated provider default privileges
        run: psql 'postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f scripts/backend/provider-defaults.sql
      - name: Capture catalog and compare to production metadata
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -t -A -v ON_ERROR_STOP=1 -f scripts/backend/catalog.sql > reconstructed-catalog.json
          node scripts/backend/compare-catalog.mjs operations/backend/production-catalog.json reconstructed-catalog.json catalog-diff.json
      - name: Verify generated database types
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: |
          # CLI 2.109.1 gen types invokes this exact image without start's registry fallback.
          # Cache the publisher's same-version GHCR image under its expected ECR tag.
          docker pull ghcr.io/supabase/postgres-meta:v0.96.6
          docker tag ghcr.io/supabase/postgres-meta:v0.96.6 public.ecr.aws/supabase/postgres-meta:v0.96.6
          npx --no-install supabase gen types typescript --local --schema public --workdir .backend-ci > reconstructed.types.ts 2> type-generation.log
          node scripts/backend/compare-types.mjs src/lib/database.types.ts reconstructed.types.ts
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-reconstruction-${{ github.sha }}
          path: |
            backend-reconstruction.log
            reconstructed-catalog.json
            catalog-diff.json
            reconstructed.types.ts
            type-generation.log
          if-no-files-found: ignore
      - name: Stop only the isolated remote stack
        if: always()
        run: npx --no-install supabase stop --workdir .backend-ci --no-backup
