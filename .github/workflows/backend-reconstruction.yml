name: Backend reconstruction
on:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true
jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node scripts/release/install.mjs
      - name: Verify and prepare authoritative migration history
        run: |
          node scripts/backend/auth-contract.mjs
          node scripts/backend/prepare.mjs --baseline-only
      - name: Rebuild database on the remote runner
        id: rebuild
        run: |
          set -o pipefail
          npx --no-install supabase start --workdir .backend-ci --exclude studio,logflare,vector,imgproxy 2>&1 | tee backend-reconstruction.log
      - name: Restore isolated provider default privileges
        run: psql 'postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres' -X -v ON_ERROR_STOP=1 -f scripts/backend/provider-defaults.sql
      - name: Capture catalog and compare to production metadata
        run: |
          psql 'postgresql://postgres:postgres@127.0.0.1:54322/postgres' -X -t -A -v ON_ERROR_STOP=1 -f scripts/backend/catalog.sql > reconstructed-catalog.json
          node scripts/backend/compare-catalog.mjs operations/backend/production-catalog.json reconstructed-catalog.json catalog-diff.json
      - name: Verify generated database types
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: |
          # CLI 2.109.1 gen types invokes this exact image without start's registry fallback.
          # Cache the publisher's same-version GHCR image under its expected ECR tag.
          docker pull ghcr.io/supabase/postgres-meta:v0.96.6
          docker tag ghcr.io/supabase/postgres-meta:v0.96.6 public.ecr.aws/supabase/postgres-meta:v0.96.6
          npx --no-install supabase gen types typescript --local --schema public --workdir .backend-ci > reconstructed.types.ts 2> type-generation.log
          node scripts/backend/compare-types.mjs src/lib/database.types.ts reconstructed.types.ts
      - name: Verify snapshot restoration against independent application metadata
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: node scripts/backend/snapshot-restore.mjs
      - name: Verify all captured Edge workers start
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: node scripts/backend/edge-boot-smoke.mjs
      - name: Verify forward detachment contract on the synthetic PostgreSQL 17 clone
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: node scripts/backend/forward-contracts.mjs
      - name: Execute every Wave 02 SQL source and real concurrency scenario
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: node scripts/backend/sql-matrix.mjs
      - name: Prove the catalog gate blocks a controlled RLS and grant failure
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: node scripts/backend/gate-injections.mjs
      - name: Exercise real Auth and clinical browser journeys on the isolated remote stack
        if: ${{ !cancelled() && steps.rebuild.outcome == 'success' }}
        run: |
          node scripts/qa/browser-fixture.mjs
          node scripts/qa/auth-onboarding.mjs
          node scripts/qa/auth-captcha.mjs
          npm run build
          npx --no-install vite build --config e2e/qa-build.config.mjs
          node scripts/qa/css-gate-injection.mjs
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-reconstruction-${{ github.sha }}
          path: |
            backend-reconstruction.log
            reconstructed-catalog.json
            catalog-diff.json
            reconstructed.types.ts
            type-generation.log
            .backend-ci/restore-results/
            .backend-ci/edge-results/
            .backend-ci/forward-results/
            .backend-ci/auth-onboarding-results/
            .backend-ci/auth-captcha-results/
            .backend-ci/sql-results/
            .backend-ci/browser-results/
            .backend-ci/fault-results/
            e2e/critical-journeys.spec.js-snapshots/
          if-no-files-found: ignore
      - name: Stop only the isolated remote stack
        if: always()
        run: npx --no-install supabase stop --workdir .backend-ci --no-backup
